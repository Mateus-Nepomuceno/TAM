[project]
name = 'tam'
version = '0.1.0'
description = ''
authors = [
    {name = 'Luciano Souza',email = 'contato.lucianosouza37@gmail.com'},
    {name = 'Maria Eduarda',email = 'eduardassilva095@gmail.com'},
    {name = 'Mateus Nepomuceno',email = 'mateusnepomuceno2000@gmail.com'},
    {name = 'Murilo Moura',email = 'mouramurilo631@gmail.com'}
]
readme = 'README.md'
requires-python = '>=3.12,<3.14'
dependencies = [
    'fastapi[standard] (>=0.161.0,<0.162.0)',
    "beanie (>=2.2.0,<3.0.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
]


[build-system]
requires = ['poetry-core>=2.0.0,<3.0.0']
build-backend = 'poetry.core.masonry.api'

[dependency-groups]
dev = [
    'ruff (>=0.17.2,<0.18.0)',
    'httpx2 (>=2.16.0,<3.0.0)',
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['PLR0913', 'PLR0917']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.poe.tasks]
lint = { cmd = 'ruff check' }
format.sequence = [
  { cmd = 'ruff check --fix' },
  { cmd = 'ruff format' },
]
serve = 'fastapi dev tam/app.py'